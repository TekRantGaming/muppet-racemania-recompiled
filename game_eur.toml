[recompiler]
seeds = "seeds/ghidra_funcs_eur.txt"
out_dir = "generated"
strict = true
# Trusted mod entry hooks (muppet_mods.c, package muppet.pc). Inert unless
# the plugin registers for them. Changing this list needs a regenerate.
mod_function_entry_funcs = [
  "0x800939B4",  # BIOS free() thunk: retail [buf-4] |= 1 (OpenBIOS hangs here)
]

[runtime]
window_title = "Muppet RaceMania Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "analog"
# No launcher yet: player 1 uses the first connected controller (default would be keyboard).
p1_device = "auto"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "6f4df02727d3024b9ca3bea8ea84d432586289a08e5ef28f89f6a6c9d7ddaa95"

# Widescreen (feature "widescreen" of muppet.pc): the renderer's screen-X culls,
# widened by the live reveal while the view is 16:9 (identity at 4:3). The same
# functions as the USA EXE at this build's addresses; the vertical tests here
# compare with 0x100 (PAL), and the distance tests stay as they are.
[widescreen]
# 16:9 for every frame that projects 3D (races, the title, menus over 3D);
# frames without GTE work (loading screens, FMV) keep their 4:3 picture.
gte_game_mode = true

