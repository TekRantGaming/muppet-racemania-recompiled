[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Trusted mod entry hooks (muppet_mods.c, package muppet.pc). Inert unless
# the plugin registers for them. Changing this list needs a regenerate.
mod_function_entry_funcs = [
  "0x80093360",  # BIOS free() thunk: retail [buf-4] |= 1 (OpenBIOS hangs here)
]
# Track-piece cull in the hand-written renderer (both regions, same code):
# a piece is dropped when |x| > z + radius, a 4:3 view cone. In 16:9 the
# widescreen plugin scales |x| down by the wider view just before each test.
mod_instruction_sites = [
  "0x800101B4",  # sub t0, t0, a1   (0x80010000, near pieces)
  "0x80010278",  # sub a1, t0, a1   (0x80010000, far pieces)
  "0x80010484",  # sub a1, t0, a1   (0x8001031C)
  "0x8001161C",  # sub a1, t0, a1   (0x80010E90)
  "0x80011700",  # sub a1, t0, a1   (0x80010E90)
  "0x80011998",  # sub a1, t0, a1   (0x80011774)
  "0x80010108",  # beqz t9: piece not in the track's visibility mask (0x800C1AC8)
  "0x800103F4",  # beqz t9: same, 0x8001031C
  "0x80011290",  # bnez t5 after slti t5, s4, 0x28: polygon nearer than OTZ 40 dropped
  "0x800121BC",  # bnez t5 after slti t5, s4, 0x28 (object renderer 0x80011E3C)
  "0x80078A94",  # bnez v0 after slti v0, v0, 2: race frame waits for 2 VBlanks (0x800B0DD8); frame-rate plugin
]

[runtime]
window_title = "Muppet RaceMania Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "analog"
# No launcher yet: player 1 uses the first connected controller (default would be keyboard).
p1_device = "auto"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "69f45212f9b9cf9a87212acac5dd624e639b0a72dcb85a12df843804a8fc2dd5"

# Widescreen (feature "widescreen" of muppet.pc): the renderer's screen-X culls,
# widened by the live reveal while the view is 16:9 (identity at 4:3). From the
# boot EXE's disassembly; the vertical tests (0xF0) and the distance tests
# (|v| < 0x200 after a negu) are not culls and stay as they are.
#   screen_x  sltiu r, SX&0xFFFF, 0x200   a vertex inside [0, 512)
#   slti      slti  r, SX, 0x200/0x201    right edge
#   bgez/bltz the left-edge chains (bltz: the last vertex, or a rectangle's edge)
[widescreen]
# 16:9 for every frame that projects 3D (races, the title, menus over 3D);
# frames without GTE work (loading screens, FMV) keep their 4:3 picture.
gte_game_mode = true

[widescreen.cull]
# The sites from 0x80017E6C on are the near-camera subdivision renderers' outcode tests
