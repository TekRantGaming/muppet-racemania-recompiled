players = 2
exe = "disc/SLUS_012.37"
disc = "disc/Muppet RaceMania (USA).cue"   # pass the player's own disc with --disc
load_address = "0x80010000"
entry_pc = "0x80093214"
text_size = "0x000A1000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Muppet RaceMania (USA).bin"
cue_name = "Muppet RaceMania (USA).cue"
boot_exe = "SLUS_012.37"
