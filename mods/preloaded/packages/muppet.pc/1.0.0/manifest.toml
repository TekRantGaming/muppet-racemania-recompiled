format_version = 5
id = "muppet.pc"
version = "1.0.0"
name = "PC Compatibility"
author = "TekRantGaming"
description = "Makes Muppet RaceMania run on the bundled OpenBIOS: the BIOS free() call behaves as on a real PlayStation."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01237"

[[target]]
game_id = "SCES-02008"

[[feature]]
id = "pc"
name = "PC Compatibility"
description = "Enabled by default."
group = "Quality of Life"
default_enabled = true

[[plugin]]
feature = "pc"
id = "muppet.pc"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "16:9 in races, with the wider view the game never showed. Enabled by default."
group = "Display"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "muppet.widescreen"

[[feature]]
id = "frame-rate"
name = "Frame Rate"
description = "Races at the original 30 FPS (25 on a Europe disc) or at 60 (50)."
group = "Display"
default_enabled = true

[[option]]
feature = "frame-rate"
id = "rate"
label = "Frame rate"
type = "choice"
default = "original"

[[option.choice]]
value = "original"
label = "Original (30 FPS)"

[[option.choice]]
value = "60"
label = "60 FPS"

[[plugin]]
feature = "frame-rate"
id = "muppet.framerate"

[[feature]]
id = "draw-distance"
name = "Draw Distance"
description = "How far ahead the track and objects are drawn: the original distance or further."
group = "Display"
default_enabled = true

[[option]]
feature = "draw-distance"
id = "distance"
label = "Draw distance"
type = "choice"
default = "far"

[[option.choice]]
value = "original"
label = "Original"

[[option.choice]]
value = "far"
label = "Far (1.5x)"

[[option.choice]]
value = "farther"
label = "Farther (2x)"

[[plugin]]
feature = "draw-distance"
id = "muppet.drawdistance"
